# The self-hosted runner defaults to `sh`; restore the GitHub-hosted
# default (`bash -e`) that these scripts were written and tested against.
defaults:
  run:
    shell: bash -e {0}

jobs:
  only-build:
    name: build ${{ inputs.cann_tag }} (${{ matrix.arch }})
    if: ${{ !inputs.publish }} 
    runs-on: ${{ matrix.runner }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/act-environments-ubuntu:act-22.04
      env:
        SOC: ${{ contains(inputs.cann_tag, '910b') && '910b' || contains(inputs.cann_tag, '310p') && '310p' || contains(inputs.cann_tag, '950') && '950' || contains(inputs.cann_tag, 'a3') && 'a3' || '' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: linux-amd64-cpu-4
          - arch: arm64
            platform: linux/arm64
            runner: linux-aarch64-cpu-4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -f manylinux/${{ inputs.cann_tag }}/Dockerfile \
            --provenance=false \
            manylinux/${{ inputs.cann_tag }}

  build-push-digest:
    name: build ${{ inputs.cann_tag }} (${{ matrix.arch }})
    if: ${{ inputs.publish }}
    runs-on: ${{ matrix.runner }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/act-environments-ubuntu:act-22.04
      env:
        SOC: ${{ contains(inputs.cann_tag, '910b') && '910b' || contains(inputs.cann_tag, '310p') && '310p' || contains(inputs.cann_tag, '950') && '950' || contains(inputs.cann_tag, 'a3') && 'a3' || '' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: linux-amd64-cpu-4
          - arch: arm64
            platform: linux/arm64
            runner: linux-aarch64-cpu-4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          apt-get update
          apt-get install -y jq

      - name: Login to Huawei Cloud SWR
        env:
          HW_USERNAME: ${{ secrets.HW_USERNAME }}
          HW_TOKEN: ${{ secrets.HW_TOKEN }}
        run: |
          echo "$HW_TOKEN" | docker login \
            -u "$HW_USERNAME" --password-stdin \
            swr.cn-southwest-2.myhuaweicloud.com

      - name: Build and push by digest
        id: build
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -f manylinux/${{ inputs.cann_tag }}/Dockerfile \
            --provenance=false \
            --metadata-file /tmp/build-metadata.json \
            --output "type=image,name=swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/manylinux,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=false" \
            manylinux/${{ inputs.cann_tag }}
          digest=$(jq -r '.["containerimage.digest"] // empty' /tmp/build-metadata.json)
          if [ -z "$digest" ]; then
            digest=$(jq -r '.["containerimage.name"] // empty' /tmp/build-metadata.json)
            digest="${digest#*@}"
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ inputs.cann_tag }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  push-image:
    runs-on: linux-amd64-cpu-4
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/act-environments-ubuntu:act-22.04
    needs: build-push-digest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          apt-get update
          apt-get install -y jq

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.cann_tag }}-*
          merge-multiple: true

      - name: Login to Huawei Cloud SWR
        env:
          HW_USERNAME: ${{ secrets.HW_USERNAME }}
          HW_TOKEN: ${{ secrets.HW_TOKEN }}
        run: |
          echo "$HW_TOKEN" | docker login \
            -u "$HW_USERNAME" --password-stdin \
            swr.cn-southwest-2.myhuaweicloud.com

      - name: Prepare tags
        id: prepare-tags
        run: |
          BASE_TAG=$(jq -r --arg cann_tag "${{ inputs.cann_tag }}" \
            '.versions[] | select(.path == "manylinux/" + $cann_tag) | .tags[0]' \
            manylinux_publish_version.json)
          registry="swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/manylinux"
          TAGS_JSON="[\"${registry}:${BASE_TAG}\"]"
          echo "tags=${TAGS_JSON}" >> $GITHUB_OUTPUT

      - name: Create manifest list and push
        env:
          TAGS: ${{ steps.prepare-tags.outputs.tags }}
        run: |
          cd "$RUNNER_TEMP/digests" || exit 1
          TAG=$(echo "$TAGS" | jq -r '.[0]')
          if [[ "$TAG" == swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/manylinux* ]]; then
            docker buildx imagetools create -t "$TAG" \
              $(printf 'swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/manylinux@sha256:%s ' *)
          else
            echo "Error: Unknown registry in TAG: $TAG"
            exit 1
          fi

  sync-image:
    name: sync public image ${{ inputs.cann_tag }}
    runs-on: ubuntu-latest
    needs: push-image
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Login to Huawei Cloud SWR
        env:
          HW_USERNAME: ${{ secrets.HW_USERNAME }}
          HW_TOKEN: ${{ secrets.HW_TOKEN }}
        run: |
          echo "${HW_TOKEN}" | skopeo login \
            --username "${HW_USERNAME}" \
            --password-stdin \
            swr.cn-southwest-2.myhuaweicloud.com

      - name: Login to Quay
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          echo "${QUAY_TOKEN}" | skopeo login \
            --username "${QUAY_USERNAME}" \
            --password-stdin \
            quay.io

      - name: Sync image to Quay
        run: |
          skopeo copy --all \
            docker://swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/manylinux:${{ inputs.cann_tag }} \
            docker://quay.io/ascend/manylinux:${{ inputs.cann_tag }}