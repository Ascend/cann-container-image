name: Build and Publish CANN Test Image

on:
  workflow_call:
    inputs:
      cann_tag:
        description: 'CANN unique tag'
        required: true
        type: string
      cann_version:
        description: 'CANN version'
        required: true
        type: string
      py_version:
        description: 'Python version'
        required: true
        type: string
      os_version:
        description: 'OS version'
        required: true
        type: string
      soc:
        description: 'SOC version (CANN package naming)'
        required: true
        type: string
      soc_lower:
        description: 'SOC version (lowercase) used for buildkitd worker pinning'
        required: false
        type: string
        default: 'a3'
      dockerfile:
        description: 'Test Dockerfile filename'
        required: true
        type: string
      push:
        description: 'Push images to registries'
        required: false
        type: boolean
        default: true
    secrets:
      HW_USERNAME_DAILY:
        description: 'Huawei Cloud SWR username for daily'
        required: false
      HW_TOKEN_DAILY:
        description: 'Huawei Cloud SWR token for daily'
        required: false
  workflow_dispatch:
    inputs:
      cann_tag:
        description: 'CANN unique tag'
        required: true
        type: string
        default: '2026.07.29-a3-ubuntu22.04-py3.12'
      cann_version:
        description: 'CANN version'
        required: true
        type: string
        default: '9.1.0-20260731131545'
      py_version:
        description: 'Python version'
        required: true
        type: string
        default: '3.12.13'
      os_version:
        description: 'OS version'
        required: true
        type: string
        default: '22.04'
      soc:
        description: 'SOC version (CANN package naming)'
        required: true
        type: string
        default: 'A3'
      soc_lower:
        description: 'SOC version (lowercase) used for buildkitd worker pinning'
        required: false
        type: string
        default: 'a3'
      dockerfile:
        description: 'Test Dockerfile filename'
        required: true
        type: string
        default: 'Dockerfile.ubuntu.cann.test'
      push:
        description: 'Push images to registries'
        required: false
        type: boolean
        default: true

jobs:
  build-push-digest:
    name: build ${{ inputs.cann_tag }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/act-environments-ubuntu:act-22.04
      env:
        SOC: ${{ inputs.soc_lower }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: linux-amd64-cpu-4
          - arch: arm64
            platform: linux/arm64
            runner: linux-aarch64-cpu-4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install jq
        if: ${{ inputs.push }}
        run: |
          apt-get update
          apt-get install -y jq

      - name: Login to Huawei Cloud SWR (cn-north-12)
        if: ${{ inputs.push }}
        env:
          HW_USERNAME_DAILY: ${{ secrets.HW_USERNAME_DAILY }}
          HW_TOKEN_DAILY: ${{ secrets.HW_TOKEN_DAILY }}
        run: |
          docker login -u cn-north-12@"$HW_USERNAME_DAILY" -p "$HW_TOKEN_DAILY" swr.cn-north-12.myhuaweicloud.com

      - name: Compute CANN short version
        id: cann
        env:
          CANN_VERSION: ${{ inputs.cann_version }}
        run: |
          SHORT_VERSION=$(echo "${CANN_VERSION}" | grep -oE '[0-9]+(\.[0-9]+)+' | head -1 | cut -d'.' -f1-3)
          echo "short_version=${SHORT_VERSION}" >> $GITHUB_OUTPUT

      - name: Build (PR check, no push)
        if: ${{ !inputs.push }}
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -f cann_test_version/${{ inputs.dockerfile }} \
            --build-arg OS_VERSION=${{ inputs.os_version }} \
            --build-arg PY_VERSION=${{ inputs.py_version }} \
            --build-arg CANN_VERSION=${{ inputs.cann_version }} \
            --build-arg SOC_VERSION=${{ inputs.soc }} \
            --build-arg CANN_SHORT_VERSION=${{ steps.cann.outputs.short_version }} \
            --provenance=false \
            .

      - name: Build and push by digest
        if: ${{ inputs.push }}
        id: build
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -f cann_test_version/${{ inputs.dockerfile }} \
            --build-arg OS_VERSION=${{ inputs.os_version }} \
            --build-arg PY_VERSION=${{ inputs.py_version }} \
            --build-arg CANN_VERSION=${{ inputs.cann_version }} \
            --build-arg SOC_VERSION=${{ inputs.soc }} \
            --build-arg CANN_SHORT_VERSION=${{ steps.cann.outputs.short_version }} \
            --provenance=false \
            --metadata-file /tmp/build-metadata.json \
            --output "type=image,name=swr.cn-north-12.myhuaweicloud.com/atlas_inference/cann,push-by-digest=true,name-canonical=true,push=true" \
            .
          digest=$(jq -r '.["containerimage.digest"] // empty' /tmp/build-metadata.json)
          if [ -z "$digest" ]; then
            digest=$(jq -r '.["containerimage.name"] // empty' /tmp/build-metadata.json)
            digest="${digest#*@}"
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Export digest
        if: ${{ inputs.push }}
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ inputs.cann_tag }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  push-image:
    name: manifest ${{ inputs.cann_tag }}
    runs-on: linux-amd64-cpu-4
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/act-environments-ubuntu:act-22.04
    needs: build-push-digest
    if: ${{ inputs.push }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.cann_tag }}-*
          merge-multiple: true

      - name: Login to Huawei Cloud SWR (cn-north-12)
        env:
          HW_USERNAME_DAILY: ${{ secrets.HW_USERNAME_DAILY }}
          HW_TOKEN_DAILY: ${{ secrets.HW_TOKEN_DAILY }}
        run: |
          docker login -u cn-north-12@"$HW_USERNAME_DAILY" -p "$HW_TOKEN_DAILY" swr.cn-north-12.myhuaweicloud.com

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create -t swr.cn-north-12.myhuaweicloud.com/atlas_inference/cann:${{ inputs.cann_tag }} \
            $(printf 'swr.cn-north-12.myhuaweicloud.com/atlas_inference/cann@sha256:%s ' *)