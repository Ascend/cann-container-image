name: Batch Build and Publish Manylinux CANN Image

on:
  workflow_dispatch:
    inputs:
      cann_version:
        description: 'CANN Version'
        type: choice
        required: true
        options:
          - 9.2.2
          - 9.2.0
          - 9.2.0-beta.2
          - 9.2.0-beta.1
          - 9.1.1
          - 9.1.0
          - 9.0.1
          - 9.1.0-beta.3
          - 9.1.0-beta.1
          - 9.0.0
          - 8.5.2
          - 8.5.1
          - 8.5.0
          - 8.3.rc2
          - 8.3.rc1
          - 8.2.rc2
          - 8.2.rc1
          - 8.1.rc1
          - 8.0.0

      publish:
        description: 'Publish the image'
        default: false
        type: boolean
        required: true
      sync_only:
        description: 'Only sync existing images to Quay (skip build/push)'
        default: false
        type: boolean
        required: true

concurrency:
  group: batch-manylinux
  cancel-in-progress: false

# The self-hosted runner defaults to `sh`; restore the GitHub-hosted
# default (`bash -e`) that these scripts were written and tested against.
defaults:
  run:
    shell: bash -e {0}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate matrix
        id: set-matrix
        run: |
          CANN_VERSION="${{ inputs.cann_version }}"
          MATRIX_JSON=$(jq --arg ver "$CANN_VERSION" \
            '[.versions[] | .path | ltrimstr("manylinux/") | select(startswith($ver + "-310p-") or startswith($ver + "-910b-") or startswith($ver + "-a3-") or startswith($ver + "-950-"))]' \
            manylinux_publish_version.json)
          if [ "$MATRIX_JSON" = "[]" ]; then
            echo "Error: No matching tags found for CANN version '$CANN_VERSION'"
            exit 1
          fi
          {
            echo "matrix<<EOF"
            echo "{\"cann_tag\":$MATRIX_JSON}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: ${{ !inputs.sync_only }}
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/build_and_push_manylinux.yml
    with:
      cann_tag: ${{ matrix.cann_tag }}
      publish: ${{ inputs.publish }}
    secrets: inherit

  sync:
    name: sync ${{ matrix.cann_tag }} to Quay
    needs: prepare
    if: ${{ inputs.sync_only }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Login to Huawei Cloud SWR
        env:
          HW_USERNAME: ${{ secrets.HW_USERNAME }}
          HW_TOKEN: ${{ secrets.HW_TOKEN }}
        run: |
          printf '%s' "${HW_TOKEN}" | skopeo login \
            --username "${HW_USERNAME}" \
            --password-stdin \
            swr.cn-southwest-2.myhuaweicloud.com

      - name: Login to Quay
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          printf '%s' "${QUAY_TOKEN}" | skopeo login \
            --username "${QUAY_USERNAME}" \
            --password-stdin \
            quay.io

      - name: Sync image to Quay
        run: |
          skopeo copy --all \
            docker://swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/manylinux:${{ matrix.cann_tag }} \
            docker://quay.io/ascend/manylinux:${{ matrix.cann_tag }}