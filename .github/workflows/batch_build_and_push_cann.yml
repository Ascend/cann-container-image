name: Batch Build and Publish CANN Image

on:
  workflow_dispatch:
    inputs:
      cann_version:
        description: 'CANN Version'
        type: choice
        required: true
        options:
          - 9.2.0
          - 9.2.0-beta.2
          - 9.2.0-beta.1
          - 9.1.1
          - 9.1.0
          - 9.0.1
          - 9.1.0-beta.3
          - 9.1.0-beta.1
          - 9.0.0
          - 9.0.0-beta.2
          - 9.0.0-beta.1
          - 8.5.2
          - 8.5.1
          - 8.5.0
          - 8.5.0.alpha002
          - 8.5.0.alpha001
          - 8.3.rc2
          - 8.3.rc1
          - 8.3.rc1.alpha003
          - 8.3.rc1.alpha002
          - 8.3.rc1.alpha001
          - 8.2.rc2
          - 8.2.rc1
          - 8.2.rc1.alpha003
          - 8.2.rc1.alpha002
          - 8.2.rc1.alpha001
          - 8.1.rc1

      publish_base:
        description: 'Publish base image'
        default: false
        type: boolean
        required: true
      publish_devel:
        description: 'Publish devel image'
        default: false
        type: boolean
        required: true

concurrency:
  group: batch-cann
  cancel-in-progress: false

# The self-hosted runner defaults to `sh`; restore the GitHub-hosted
# default (`bash -e`) that these scripts were written and tested against.
defaults:
  run:
    shell: bash -e {0}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate matrix
        id: set-matrix
        run: |
          CANN_VERSION="${{ inputs.cann_version }}"
          MATRIX_JSON=$(jq --arg ver "$CANN_VERSION" \
            '[.versions[] | .path | ltrimstr("cann/") | select(startswith($ver + "-310p-") or startswith($ver + "-910-") or startswith($ver + "-910b-") or startswith($ver + "-a3-") or startswith($ver + "-950-"))]
             | to_entries
             | sort_by(
                 (if .value | test("-py3\\.12$") then 0
                  elif .value | test("-py3\\.11$") then 1
                  elif .value | test("-py3\\.10$") then 2
                  else 3 end),
                 (if .value | test("-910-") then 1 else 0 end),
                 .key)
             | map(.value)' \
            cann_publish_version.json)
          if [ "$MATRIX_JSON" = "[]" ]; then
            echo "Error: No matching tags found for CANN version '$CANN_VERSION'"
            exit 1
          fi
          {
            echo "matrix<<EOF"
            echo "{\"cann_tag\":$MATRIX_JSON}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/build_and_push_cann.yml
    with:
      cann_tag: ${{ matrix.cann_tag }}
      publish_base: ${{ inputs.publish_base }}
      publish_devel: ${{ inputs.publish_devel }}
    secrets: inherit