          BASE_TAGS=$(jq -r --arg cann_tag "${{ inputs.cann_tag }}" \
            '.versions[] | select(.path == "cann/" + $cann_tag) | .tags[]' \
            cann_publish_version.json)
          registry="swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann"
          first=true
          TAGS_JSON="["
          for tag in $(echo "$BASE_TAGS" | tr ',' ' '); do
            if [ "$first" != true ]; then
              TAGS_JSON+=","
            fi
            TAGS_JSON+="\"${registry}:${tag}\""
            first=false
          done
          TAGS_JSON+="]"
          echo "tags=${TAGS_JSON}" >> $GITHUB_OUTPUT

      - name: Create manifest list and push
        env:
          TAGS: ${{ steps.prepare-tags.outputs.tags }}
        run: |
          cd "$RUNNER_TEMP/digests" || exit 1
          readarray -t TAGS_ARRAY <<< "$(echo "$TAGS" | jq -r '.[]')"

          for TAG in "${TAGS_ARRAY[@]}"; do
            if [[ "$TAG" == swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann* ]]; then
              docker buildx imagetools create -t "$TAG"-devel \
                $(printf 'swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann@sha256:%s ' *)
            else
