      publish_base:
        description: 'Publish base image'
        default: false
        type: boolean
        required: true

      publish_devel:
        description: 'Publish devel image'
        default: false
        type: boolean
        required: true

# The self-hosted runner defaults to `sh`; restore the GitHub-hosted
# default (`bash -e`) that these scripts were written and tested against.
defaults:
  run:
    shell: bash -e {0}

jobs:
  only-build:
    name: build ${{ inputs.cann_tag }} (${{ matrix.arch }})
    if: ${{ !inputs.publish_base && !inputs.publish_devel}} 
    runs-on: ${{ matrix.runner }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/act-environments-ubuntu:act-22.04
      env:
        SOC: ${{ contains(inputs.cann_tag, '910b') && '910b' || contains(inputs.cann_tag, '910') && '910' || contains(inputs.cann_tag, '310p') && '310p' || contains(inputs.cann_tag, '950') && '950' || contains(inputs.cann_tag, 'a3') && 'a3' || '' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: linux-amd64-cpu-4
          - arch: arm64
            platform: linux/arm64
            runner: linux-aarch64-cpu-4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -f cann/${{ inputs.cann_tag }}/Dockerfile \
            --provenance=false \
            cann/${{ inputs.cann_tag }}

  build-push-digest:
    name: build ${{ inputs.cann_tag }} (${{ matrix.arch }})
    if: ${{ inputs.publish_base }}
    runs-on: ${{ matrix.runner }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/act-environments-ubuntu:act-22.04
      env:
        SOC: ${{ contains(inputs.cann_tag, '910b') && '910b' || contains(inputs.cann_tag, '910') && '910' || contains(inputs.cann_tag, '310p') && '310p' || contains(inputs.cann_tag, '950') && '950' || contains(inputs.cann_tag, 'a3') && 'a3' || '' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: linux-amd64-cpu-4
          - arch: arm64
            platform: linux/arm64
            runner: linux-aarch64-cpu-4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          apt-get update
          apt-get install -y jq

      - name: Login to Huawei Cloud SWR
        env:
          HW_USERNAME: ${{ secrets.HW_USERNAME }}
          HW_TOKEN: ${{ secrets.HW_TOKEN }}
        run: |
          echo "$HW_TOKEN" | docker login \
            -u "$HW_USERNAME" --password-stdin \
            swr.cn-southwest-2.myhuaweicloud.com

      - name: Build and push by digest
        id: build
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -f cann/${{ inputs.cann_tag }}/Dockerfile \
            --provenance=false \
            --metadata-file /tmp/build-metadata.json \
            --output "type=image,name=swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=false" \
            cann/${{ inputs.cann_tag }}
          digest=$(jq -r '.["containerimage.digest"] // empty' /tmp/build-metadata.json)
          if [ -z "$digest" ]; then
            digest=$(jq -r '.["containerimage.name"] // empty' /tmp/build-metadata.json)
            digest="${digest#*@}"
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ inputs.cann_tag }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  
  push-image:
    runs-on: linux-amd64-cpu-4
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/act-environments-ubuntu:act-22.04
    needs: build-push-digest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          apt-get update
          apt-get install -y jq

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.cann_tag }}-*
          merge-multiple: true

      - name: Login to Huawei Cloud SWR
        env:
          HW_USERNAME: ${{ secrets.HW_USERNAME }}
          HW_TOKEN: ${{ secrets.HW_TOKEN }}
        run: |
          echo "$HW_TOKEN" | docker login \
            -u "$HW_USERNAME" --password-stdin \
            swr.cn-southwest-2.myhuaweicloud.com

      - name: Prepare tags
        id: prepare-tags
        run: |
          BASE_TAGS=$(jq -r --arg cann_tag "${{ inputs.cann_tag }}" \
            '.versions[] | select(.path == "cann/" + $cann_tag) | .tags[]' \
            cann_publish_version.json)
          registry="swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann"
          first=true
          TAGS_JSON="["
          for tag in $(echo "$BASE_TAGS" | tr ',' ' '); do
            if [ "$first" != true ]; then
              TAGS_JSON+=","
            fi
            TAGS_JSON+="\"${registry}:${tag}\""
            first=false
          done
          TAGS_JSON+="]"
          echo "tags=${TAGS_JSON}" >> $GITHUB_OUTPUT

      - name: Create manifest list and push
        env:
          TAGS: ${{ steps.prepare-tags.outputs.tags }}
        run: |
          cd "$RUNNER_TEMP/digests" || exit 1
          readarray -t TAGS_ARRAY <<< "$(echo "$TAGS" | jq -r '.[]')"

          for TAG in "${TAGS_ARRAY[@]}"; do
            if [[ "$TAG" == swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann* ]]; then
              docker buildx imagetools create -t "$TAG" \
                $(printf 'swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann@sha256:%s ' *)
            else
              echo "Error: Unknown registry in TAG: $TAG"
              exit 1
            fi
          done

  sync-public-image:
    name: sync public image ${{ inputs.cann_tag }}
    runs-on: ubuntu-latest
    needs: push-image
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Login to Huawei Cloud SWR
        env:
          HW_USERNAME: ${{ secrets.HW_USERNAME }}
          HW_TOKEN: ${{ secrets.HW_TOKEN }}
        run: |
          echo "${HW_TOKEN}" | skopeo login \
            --username "${HW_USERNAME}" \
            --password-stdin \
            swr.cn-southwest-2.myhuaweicloud.com

      - name: Login to Quay
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          echo "${QUAY_TOKEN}" | skopeo login \
            --username "${QUAY_USERNAME}" \
            --password-stdin \
            quay.io

      - name: Login to DockerHub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          echo "${DOCKER_TOKEN}" | skopeo login \
            --username "${DOCKER_USERNAME}" \
            --password-stdin \
            docker.io

      - name: Sync image to Quay and DockerHub
        run: |
          skopeo copy --all \
            docker://swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:${{ inputs.cann_tag }} \
            docker://quay.io/ascend/cann:${{ inputs.cann_tag }}

          skopeo copy --all \
            docker://swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:${{ inputs.cann_tag }} \
            docker://docker.io/ascendai/cann:${{ inputs.cann_tag }}

  sync-ascendhub-image:
    name: sync image to AscendHub ${{ inputs.cann_tag }}
    runs-on: linux-amd64-cpu-4
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/act-environments-ubuntu:act-22.04
    needs: push-image
    steps:
      - name: Install skopeo
        run: |
          apt-get update
          apt-get install -y skopeo

      - name: Login to Huawei Cloud SWR
        env:
          HW_USERNAME: ${{ secrets.HW_USERNAME }}
          HW_TOKEN: ${{ secrets.HW_TOKEN }}
        run: |
          echo "${HW_TOKEN}" | skopeo login \
            --username "${HW_USERNAME}" \
            --password-stdin \
            swr.cn-southwest-2.myhuaweicloud.com

      - name: Login to AscendHub
        env:
          ASCENDHUB_USERNAME: ${{ secrets.ASCENDHUB_USERNAME }}
          ASCENDHUB_TOKEN: ${{ secrets.ASCENDHUB_TOKEN }}
        run: |
          echo "${ASCENDHUB_TOKEN}" | skopeo login \
            --username "${ASCENDHUB_USERNAME}" \
            --password-stdin \
            swr.cn-east-3.myhuaweicloud.com

      - name: Sync image to AscendHub
        run: |
          skopeo copy --all \
            docker://swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:${{ inputs.cann_tag }} \
            docker://swr.cn-east-3.myhuaweicloud.com/ascendhub-test/cann:${{ inputs.cann_tag }}

  build-push-devel-digest:
    needs: push-image
    name: build ${{ inputs.cann_tag }}-devel (${{ matrix.arch }})
    if: ${{ inputs.publish_devel }}
    runs-on: ${{ matrix.runner }}
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/act-environments-ubuntu:act-22.04
      env:
        SOC: ${{ contains(inputs.cann_tag, '910b') && '910b' || contains(inputs.cann_tag, '910') && '910' || contains(inputs.cann_tag, '310p') && '310p' || contains(inputs.cann_tag, '950') && '950' || contains(inputs.cann_tag, 'a3') && 'a3' || '' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: linux-amd64-cpu-4
          - arch: arm64
            platform: linux/arm64
            runner: linux-aarch64-cpu-4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          apt-get update
          apt-get install -y jq

      - name: Login to Huawei Cloud SWR
        env:
          HW_USERNAME: ${{ secrets.HW_USERNAME }}
          HW_TOKEN: ${{ secrets.HW_TOKEN }}
        run: |
          echo "$HW_TOKEN" | docker login \
            -u "$HW_USERNAME" --password-stdin \
            swr.cn-southwest-2.myhuaweicloud.com

      - name: Build and push by digest
        id: build-devel
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -f cann/${{ inputs.cann_tag }}-devel/Dockerfile \
            --provenance=false \
            --metadata-file /tmp/build-metadata.json \
            --output "type=image,name=swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=false" \
            cann/${{ inputs.cann_tag }}-devel
          digest=$(jq -r '.["containerimage.digest"] // empty' /tmp/build-metadata.json)
          if [ -z "$digest" ]; then
            digest=$(jq -r '.["containerimage.name"] // empty' /tmp/build-metadata.json)
            digest="${digest#*@}"
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/devel-digests"
          digest="${{ steps.build-devel.outputs.digest }}"
          touch "$RUNNER_TEMP/devel-digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ inputs.cann_tag }}-devel-${{ matrix.arch }}
          path: ${{ runner.temp }}/devel-digests/*
          if-no-files-found: error
          retention-days: 1

  
  push-devel-image:
    runs-on: linux-amd64-cpu-4
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/act-environments-ubuntu:act-22.04
    needs: build-push-devel-digest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          apt-get update
          apt-get install -y jq

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.cann_tag }}-devel-*
          merge-multiple: true

      - name: Login to Huawei Cloud SWR
        env:
          HW_USERNAME: ${{ secrets.HW_USERNAME }}
